<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 56px 20px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 36px;
    }

    p {
      margin: 0 0 32px;
      font-size: 18px;
      line-height: 1.6;
    }

    h2 {
      margin: 0 0 16px;
      font-size: 24px;
    }

    .projects {
      display: grid;
      gap: 14px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .project {
      padding: 18px;
      background: #ffffff;
      border: 1px solid #d8dee6;
      border-radius: 8px;
    }

    .project a {
      color: #2563eb;
      font-weight: 700;
      text-decoration: none;
    }

    .project a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>

    <p>Here are my projects.</p>

</body>
</html>
